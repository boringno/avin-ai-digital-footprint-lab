name: line-ai-live-demo-ci

on:
  push:
    paths:
      - "line-ai-live-demo/**"
      - "supabase/migrations/**"
      - ".github/workflows/line-ai-live-demo-ci.yml"
  pull_request:
    paths:
      - "line-ai-live-demo/**"
      - "supabase/migrations/**"
      - ".github/workflows/line-ai-live-demo-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: line-ai-live-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: line-ai-live-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release rules
        run: |
          npm run build
          npm run check
          npm run validate:post-procedure-safety
          npm run validate:group-source-behavior
          npm run validate:group-source-isolation
          npm run validate:ai-fallback-boundary
          npm run validate:medical-ai-fallback
          npm run validate:ai-intent-classifier
          npm run validate:onda-semantic-routing
          npm run validate:onda-xiaoying-flow
          npm run validate:clinic-ontology
          npm run validate:clinic-ontology-matcher
          npm run validate:routing-snapshot
          npm run validate:nlu-frame
          npm run validate:nlu-shadow
          npm run validate:nlu-review-boundary
          npm run validate:ci-parity
          npm run validate:pregnancy-risk-handoff
          npm run validate:workbench-presentation
          npm run validate:chat-timeline-scroll
          npm run validate:chat-timeline-behavior
          npm run validate:treatment-consultation-flow
          npm run validate:router
          npm run validate:context
          npm run validate:conversation-guard
          npm run validate:conversation-inbox
          npm run validate:conversation-store
          npm run validate:intent-classify
          npm run validate:admin-reports
          npm run validate:admin-team
          npm run validate:reporting-privacy
          npm run validate:reporting-time
          npm run validate:google-sheets
          npm run validate:monitoring
          npm run validate:operational-privacy
          npm run validate:webhook-reliability
          npm run validate:sample
          npm run validate:content-versioning
          npm run validate:runtime-releases
          npm run validate:schedule-month
          npm run validate:retention-sweep
          npm run validate:admin-login-protection
          npm run validate:tenant-scope
          npm run validate:admin-notifications
          npm run validate:handoff-recipient-settings
          npm run validate:handoff-digest
          npm run validate:handoff-notification
          npm run validate:reply-tone
          npm run validate:booking-session-expiry
          npm run validate:booking-topic-switch
          npm run validate:conversation-flows
          npm run validate:conversation-behavior
          npm run validate:customer-journey-state
          npm run validate:booking-lead-ownership
          npm run validate:conversation-sessions
          npm run validate:conversation-v2
          npm run validate:conversation-v2-nlu-adapter
          npm run validate:conversation-v2-repository
          npm run validate:conversation-v2-runtime-shadow
          npm run validate:conversation-v2-golden-journeys
          npm run validate:pricing-subject
          npm run validate:treatment-packs
          npm run validate:dialogue-state
          npm run validate:reply-plan
          npm run validate:reply-renderer
          npm run validate:treatment-knowledge
          npm run validate:nlu-decision-adapter
          npm run validate:dialogue-policy-journeys
          npm run validate:dialogue-root-fix
          npm run validate:booking-speech-act
          npm run validate:treatment-followup-intent
          npm run validate:client-screenshot-regressions
          npm run validate:treatment-selection
          npm run validate:safety-preflight
